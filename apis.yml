name: Tenkara
description: 'Tenkara is an AI-powered operations and supply chain platform for material
  manufacturers across food, supplements, cosmetics, chemicals, beverages, and OTC
  products. The platform automates 75+ workflows spanning supplier sourcing and qualification,
  procurement, freight and logistics booking, order tracking, and compliance documentation
  (COA, SDS, and audit records), helping manufacturers find better suppliers faster,
  prevent delays, and run more efficient operations. Tenkara is backed by True Ventures.'
